server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback: any path that isn't a real file goes to index.html
    # so the client-side router (react-router) can handle it. Without
    # this, a hard refresh / direct link to a route like /dashboard
    # or /jadwal-shift 404s because nginx looks for a matching file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (assets/index-<hash>.js/css) never change
    # content under the same filename, so they're safe to cache
    # indefinitely. index.html must stay revalidated on every request
    # or the browser can keep serving a stale shell that points at
    # asset hashes from a previous deploy.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
